<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var k='theme-preference',t=localStorage.getItem(k);if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');}else if(t==='light'){document.documentElement.setAttribute('data-theme','light');}else{document.documentElement.removeAttribute('data-theme');}}catch(e){} })()</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Components Showcase</title>
    <link rel="stylesheet" href="../styles/core.css">
    <link rel="stylesheet" href="../styles/card.css">
    <link rel="stylesheet" href="../styles/footer.css">
    <link rel="stylesheet" href="../styles/theme-toggle.css">
    <link rel="stylesheet" href="../styles/modal.css">

</head>
<body>
    <style>
    /* Header styling with grid */
    header {
        background-color: var(--primary);
    }

    header .grid-container {
        display: grid;
        grid-template-columns: 1fr auto;
        position: relative;
        align-items: center;
    }

    header .logo {
        padding: 0.5rem 0;
    }


    header .logo img {
        display: block;
        height: 3rem;
        width: auto;
    }

    /* Hamburger */
    header .hamburger {
        font-size: 1.5rem;
        cursor: pointer;
        display: block;
    }

    /* Nav menu */
    header nav {
        background-color: var(--primary);
        display: none;
        position: absolute;
        top: 100%;
        right: 0;
        width: 100%;
        grid-template-columns: 1fr;
    }

    header nav a {
        display: block;
        text-decoration: none;
        color: #fff;
        border-top: 1px solid #444;
        padding: 1rem;
    }

    header nav a:hover {
        background-color: #444;
    }

    /* Show menu when active */
    header nav.active {
        display: grid;
    }

    /* Larger screens */
    @media (min-width: 768px) {
        header {
            grid-template-columns: auto 1fr;
        }

        header .hamburger {
            display: none;
        }

        header nav {
            background-color: unset;
            display: grid;
            grid-auto-flow: column;
            /* horizontal nav links */
            position: static;
            width: auto;
            align-items: center;
        }

        header nav a {
            border: none;
            padding-top: 0;
            padding-bottom: 0;
        }
    }
</style>

<header>
    <div class="box-container grid-container">
        <div class="logo"><img src="../images/code.ico" alt="Logo"></div>
        <div class="hamburger" id="hamburger">&#9776;</div>
        <nav id="nav">
            <a href="/">Home</a>
            <a href="about">About</a>
            <a href="components">Components</a>
            <div class="theme-selector">
  <select id="theme-select" class="theme-dropdown" aria-label="Select theme">
    <option value="light">☀️ Light</option>
    <option value="dark">🌙 Dark</option>
    <option value="system">💻 System</option>
  </select>
</div>

        </nav>
    </div>
</header>

<script>
    const hamburger = document.getElementById('hamburger');
    const nav = document.getElementById('nav');

    hamburger.addEventListener('click', () => {
        nav.classList.toggle('active');
    });
</script>
    <main>
        <style>
    .section-media-header {
        background-color: var(--primary);
        background-image: url(../images/header-bg-1.png);
        background-size: cover;
        background-position: center;
        color: var(--primary-contrast);
        padding: 2rem 0;
    }
    
    .section-media-header h1 {
        margin: 0;
    }
</style>

<section class="section-media-header">
    <div class="box-container">
        <h1>Component Library Showcase</h1>
        <p>Reusable components and widgets for this project</p>
    </div>
</section>
        <style>
    .section-no-content .box-container {
        display: flex;
        align-items: center;
        justify-content: center;
    }
</style>

<section class="section-no-content">
    <div class="box-container" style="height: 500px;">
        <h2>No content yet</h2>
    </div>
</section>
    </main>
    <footer>
    <p>© 2026 My Website</p>
</footer>
    <script src="../scripts/theme-toggle.js"></script>
    <script src="../scripts/modal.js"></script>
</body>
</html>
