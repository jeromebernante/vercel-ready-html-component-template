            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));

        [data-theme="dark"] .icon-item {

        }

            width: 44px;
            height: 44px;
        }

            font-size: 0.9rem;
            color: var(--muted);
        }

        .icon-list-wrap {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 1rem;
        }

        @media (max-width: 640px) {
            .icon-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>
</head>

    <style>
    /* ================= HEADER ================= */

    .header-hide-on-scroll-neurox {
        position: sticky;
        top: 0;
        z-index: 1000;
        background-color: var(--bg);
        transition: transform 0.25s ease;
        will-change: transform;
    }

    /* hidden state */
    .header-hide-on-scroll-neurox.is-hidden {
        transform: translateY(-100%);
    }

    .header-hide-on-scroll-neurox .grid-container {
        display: grid;
        grid-template-columns: 1fr auto;
        position: relative;
        align-items: center;
    }

    .header-hide-on-scroll-neurox .logo {
        padding: 0.5rem 0;
    }

    .header-hide-on-scroll-neurox .logo img {
        display: block;
        height: 3rem;
        width: auto;
    }

    /* Hamburger */
    .header-hide-on-scroll-neurox .hamburger {
        font-size: 1.5rem;
        cursor: pointer;
        display: block;
    }

    /* Nav */
    .header-hide-on-scroll-neurox nav {
        background-color: var(--primary);
        display: none;
        position: absolute;
        top: 100%;
        right: 0;
        width: 100%;
        grid-template-columns: 1fr;
    }

    .header-hide-on-scroll-neurox nav a {
        display: block;
        text-decoration: none;
        color: var(--text);
        border-top: 1px solid #444;
        padding: 1rem;
    }

    /* Show menu when active */
    .header-hide-on-scroll-neurox nav.active {
        display: grid;
    }


    /* Larger screens */
    @media (min-width: 768px) {
        .header-hide-on-scroll-neurox {
            grid-template-columns: auto 1fr;
        }

        .header-hide-on-scroll-neurox .hamburger {
            display: none;
        }

        .header-hide-on-scroll-neurox nav {
            background-color: unset;
            display: grid;
            grid-auto-flow: column;
            /* horizontal nav links */
            position: static;
            width: auto;
            align-items: center;
        }

        .header-hide-on-scroll-neurox nav a {
            border: none;
            padding-top: 0;
            padding-bottom: 0;
        }

        .header-hide-on-scroll-neurox nav a.active {
            font-weight: bold;
        }
    }
</style>

<div class="theme-selector-neurox">
  <select id="theme-select" class="theme-dropdown" aria-label="Select theme">
    <option value="light">☀️ Light</option>
    <option value="dark">🌙 Dark</option>
    <option value="system">💻 System</option>
  </select>
</div>

<script>
  // Theme toggle logic
  function initThemeToggle() {
    const root = document.documentElement;
    const select = document.getElementById('theme-select');
    const storageKey = 'theme-preference';

    // Determine initial theme
    const getTheme = () => {
      const stored = localStorage.getItem(storageKey);
      if (stored && ['light', 'dark', 'system'].includes(stored)) {
        return stored;
      }
      return 'system';
    };

    const setTheme = (theme) => {
      if (theme === 'system') {
        root.removeAttribute('data-theme');
      } else {
        root.setAttribute('data-theme', theme);
      }
      localStorage.setItem(storageKey, theme);
      if (select) {
        select.value = theme;
      }
    };

    // Initialize with stored or default theme
    const currentTheme = getTheme();
    setTheme(currentTheme);

    // Listen for dropdown changes
    select.addEventListener('change', (e) => {
        const newTheme = e.target.value;
        setTheme(newTheme);
      });

    // Listen for OS theme changes (only matters if system is selected)
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      const current = localStorage.getItem(storageKey);
    });

  }

  // Run when DOM is ready

  document.addEventListener('DOMContentLoaded', () => {
    initThemeToggle();
  });
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    initThemeToggle();
  }
</script>

<script>
    // Mobile menu toggle
    const hamburger = document.querySelector('.header-hide-on-scroll-neurox .hamburger');
    const nav = document.querySelector('.header-hide-on-scroll-neurox .nav');

    hamburger.addEventListener('click', () => {
        nav.classList.toggle('active');
    });

    // Sticky hide-on-scroll logic
    const header = document.querySelector('.header-hide-on-scroll-neurox');
    let lastScrollY = window.scrollY;
    let lastToggleY = window.scrollY;
    let ticking = false;
    const HIDE_THRESHOLD = 60; // downward distance from last toggle before hiding
    const SHOW_THRESHOLD = 1; // show quickly as soon as upward movement is detected

    function handleScroll() {
        const currentScrollY = window.scrollY;

        // Keep header visible near the top of the page.
        if (currentScrollY <= 8) {
            header.classList.remove('is-hidden');
            lastToggleY = currentScrollY;
            lastScrollY = currentScrollY;
            ticking = false;
            return;
        }

        // Keep header visible while mobile menu is open.
        if (nav.classList.contains('active')) {
            header.classList.remove('is-hidden');
            lastToggleY = currentScrollY;
            lastScrollY = currentScrollY;
            ticking = false;
            return;
        }

        const movingDown = currentScrollY > lastScrollY;
        const movingUp = currentScrollY < lastScrollY;

        if (movingDown) {
            if ((currentScrollY - lastToggleY) >= HIDE_THRESHOLD && currentScrollY > header.offsetHeight) {
                header.classList.add('is-hidden');
                lastToggleY = currentScrollY;
            }
        } else if (movingUp) {
            if ((lastToggleY - currentScrollY) >= SHOW_THRESHOLD) {
                header.classList.remove('is-hidden');
                lastToggleY = currentScrollY;
            }
        }

        lastScrollY = currentScrollY;
        ticking = false;
    }

    window.addEventListener(
        'scroll',
        () => {
            if (!ticking) {
                requestAnimationFrame(handleScroll);
                ticking = true;
            }
        },
        { passive: true }
    );
</script>
