<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Listing</title>
    <link rel="stylesheet" href="styles/core.css">
    <style>
        .icon-listing-page {
            padding-bottom: 4rem;
        }

        .icon-section {
            padding-top: 0;
        }

        .icon-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
        }

        .icon-item {
            display: grid;
            place-items: center;
            gap: 0.65rem;
            min-height: 150px;
            padding: 1.25rem;
            border-radius: var(--radius);
            background: rgba(0, 0, 0, 0.03);
            color: var(--text);
            text-align: center;
        }

        [data-theme="dark"] .icon-item {
            background: rgba(255, 255, 255, 0.05);
        }

        .icon-item svg {
            width: 44px;
            height: 44px;
        }

        .icon-item figcaption {
            font-size: 0.9rem;
            color: var(--muted);
        }

        .icon-list-wrap {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 1rem;
        }

        @media (max-width: 640px) {
            .icon-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>
</head>

<body>
    [header-hide-on-scroll-neurox icons-active="active"][/header-hide-on-scroll-neurox]

    <main class="icon-listing-page">
        [section-media-header title="Icon Listing" description="Simple list of reusable icons."][/section-media-header]

        <section class="icon-section">
            <div class="box-container">
                <div class="icon-list-wrap">
                    <div class="icon-list">
                        <figure class="icon-item">[icon-home]<figcaption>Home</figcaption></figure>
                        <figure class="icon-item">[icon-menu]<figcaption>Menu</figcaption></figure>
                        <figure class="icon-item">[icon-close]<figcaption>Close</figcaption></figure>
                        <figure class="icon-item">[icon-search]<figcaption>Search</figcaption></figure>
                        <figure class="icon-item">[icon-sun]<figcaption>Sun</figcaption></figure>
                        <figure class="icon-item">[icon-moon]<figcaption>Moon</figcaption></figure>
                        <figure class="icon-item">[icon-system-theme]<figcaption>System Theme</figcaption></figure>
                        <figure class="icon-item">[icon-user]<figcaption>User</figcaption></figure>
                        <figure class="icon-item">[icon-dashboard]<figcaption>Dashboard</figcaption></figure>
                        <figure class="icon-item">[icon-phone]<figcaption>Phone</figcaption></figure>
                    </div>
                </div>
            </div>
        </section>
    </main>

    [footer][/footer]
</body>

</html>
